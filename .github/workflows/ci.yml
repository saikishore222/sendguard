name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            target
            tests-host/target
          key: cargo-${{ hashFiles('Cargo.lock', 'tests-host/Cargo.lock') }}
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.1.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build the program
        run: cargo-build-sbf --tools-version v1.52
      - name: Run the tests
        run: cargo test
        working-directory: tests-host
